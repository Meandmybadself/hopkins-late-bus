<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribers — Late Bus Alert</title>
  <!-- Not a page for search engines. It renders nothing without a secret, but a
       listing would still advertise that it exists. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    main.admin { max-width: 60rem; }
    .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat { flex: 1 1 7rem; background: #f6f7f9; border-radius: 6px; padding: 0.75rem 1rem; }
    .stat b { display: block; font-size: 1.5rem; line-height: 1.2; }
    .stat span { font-size: 0.8125rem; color: #666; }
    /* The table can outgrow a phone; it scrolls in its own box rather than
       widening the page. */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; white-space: nowrap; }
    th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: #666; }
    .pill { font-size: 0.75rem; padding: 0.125rem 0.5rem; border-radius: 999px; }
    .pill.yes { background: #dcfce7; color: #166534; }
    .pill.no { background: #fef9c3; color: #854d0e; }
    .muted { color: #777; }
    h2 { font-size: 1rem; margin: 2rem 0 0.5rem; }
    #signout { width: auto; padding: 0.375rem 0.75rem; font-size: 0.8125rem; background: #eee; color: #333; }
  </style>
</head>
<body>
  <main class="admin">
    <h1>Subscribers</h1>

    <form id="login-form">
      <label for="secret">Admin secret</label>
      <input type="password" id="secret" name="secret" required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>

    <div id="message" class="message" hidden></div>

    <div id="panel" hidden>
      <div class="stats">
        <div class="stat"><b id="s-total">0</b><span>total</span></div>
        <div class="stat"><b id="s-confirmed">0</b><span>confirmed</span></div>
        <div class="stat"><b id="s-pending">0</b><span>pending</span></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Email</th><th>School</th><th>Bus</th><th>Status</th><th>Signed up</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <h2>Recent detected delays</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>School</th><th>Bus</th><th>Late</th><th>Sheet said</th></tr>
          </thead>
          <tbody id="notif-rows"></tbody>
        </table>
      </div>

      <p class="footer-link"><button id="signout" type="button">Sign out</button></p>
    </div>
  </main>

  <script>
    const KEY = "latebus-admin-secret";
    const loginForm = document.getElementById("login-form");
    const messageEl = document.getElementById("message");
    const panel = document.getElementById("panel");

    const esc = (v) => String(v ?? "");

    function show(msg, kind) {
      messageEl.hidden = false;
      messageEl.className = "message " + kind;
      messageEl.textContent = msg;
    }

    async function load(secret) {
      const res = await fetch("/api/admin/subscribers", {
        headers: { Authorization: "Bearer " + secret },
      });

      if (res.status === 401) {
        // A stored secret that has stopped working should not leave the page
        // stuck retrying it on every reload.
        localStorage.removeItem(KEY);
        loginForm.hidden = false;
        panel.hidden = true;
        show("That secret was not accepted.", "error");
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        show(body.error || "Could not load subscribers.", "error");
        return;
      }

      const data = await res.json();
      messageEl.hidden = true;
      loginForm.hidden = true;
      panel.hidden = false;

      document.getElementById("s-total").textContent = data.summary.total;
      document.getElementById("s-confirmed").textContent = data.summary.confirmed;
      document.getElementById("s-pending").textContent = data.summary.pending;

      const rows = document.getElementById("rows");
      rows.replaceChildren();
      if (data.subscribers.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.className = "muted";
        td.textContent = "Nobody has subscribed yet.";
        tr.appendChild(td);
        rows.appendChild(tr);
      }
      for (const s of data.subscribers) {
        const tr = document.createElement("tr");
        // textContent throughout rather than innerHTML: an email address is
        // attacker-supplied text and this page is the one that renders it.
        for (const v of [s.email, s.schoolLabel, s.bus_route]) {
          const td = document.createElement("td");
          td.textContent = esc(v);
          tr.appendChild(td);
        }
        const status = document.createElement("td");
        const pill = document.createElement("span");
        pill.className = "pill " + (s.confirmed === 1 ? "yes" : "no");
        pill.textContent = s.confirmed === 1 ? "confirmed" : "pending";
        status.appendChild(pill);
        tr.appendChild(status);
        const when = document.createElement("td");
        when.className = "muted";
        when.textContent = esc(s.created_at);
        tr.appendChild(when);
        rows.appendChild(tr);
      }

      const nrows = document.getElementById("notif-rows");
      nrows.replaceChildren();
      if (data.recentNotifications.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.className = "muted";
        td.textContent = "No delays detected yet.";
        tr.appendChild(td);
        nrows.appendChild(tr);
      }
      for (const n of data.recentNotifications) {
        const tr = document.createElement("tr");
        const cells = [
          n.notified_date,
          n.schoolLabel,
          n.bus_route,
          n.minutes_late == null ? "—" : n.minutes_late + " min",
          n.school_raw || "—",
        ];
        cells.forEach((v, i) => {
          const td = document.createElement("td");
          td.textContent = esc(v);
          if (i === 4) td.className = "muted";
          tr.appendChild(td);
        });
        nrows.appendChild(tr);
      }
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const secret = document.getElementById("secret").value;
      localStorage.setItem(KEY, secret);
      try {
        await load(secret);
      } catch {
        show("Unable to connect. Please try again.", "error");
      }
    });

    document.getElementById("signout").addEventListener("click", () => {
      localStorage.removeItem(KEY);
      location.reload();
    });

    const stored = localStorage.getItem(KEY);
    if (stored) {
      loginForm.hidden = true;
      load(stored).catch(() => {
        loginForm.hidden = false;
        show("Unable to connect. Please try again.", "error");
      });
    }
  </script>
</body>
</html>
